<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Sokoni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<main class="auth">
  <div class="auth-inner">
    <div class="auth-card">
      <a class="brand" href="index.html">Sokoni<span>.</span></a>
      <h1>Welcome back</h1>
      <p class="sub">Log in to track orders and save your bag.</p>

      <form data-demo="Demo only. Connect an authentication service to log in." data-reset="false">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@email.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required>
        </div>

        <div class="row-between">
          <label class="check"><input type="checkbox"> Keep me signed in</label>
          <a href="#">Forgot password</a>
        </div>

        <button class="btn btn-block" type="submit">Log in</button>
        <p class="note" data-note style="text-align:center"></p>
      </form>

      <div class="divider">or</div>

      <a class="btn btn-ghost btn-block" href="signup.html">Create an account</a>

      <p class="auth-foot">New to Sokoni? <a href="products.html">Browse the shop</a></p>
    </div>

    <a class="back-home" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back to home
    </a>
  </div>
</main>

<script src="assets/js/app.js"></script>
</body>
</html>
